name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AzureBlobSearch.slnx

      - name: Build
        run: dotnet build AzureBlobSearch.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AzureBlobSearch.slnx --configuration Release --no-build

      - name: Build container
        run: docker build --tag azure-blob-search:ci .

